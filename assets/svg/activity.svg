<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="activity-title activity-desc">
  <title id="activity-title">LIVE SIGNAL</title><desc id="activity-desc">Retro-neon arcade interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="activity-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16082B"/><stop offset=".48" stop-color="#050510"/><stop offset="1" stop-color="#07192A"/></linearGradient>
    <linearGradient id="activity-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF2BD6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/></linearGradient>
    <radialGradient id="activity-light"><stop stop-color="#FF2BD6" stop-opacity=".2"/><stop offset=".48" stop-color="#8B5CF6" stop-opacity=".09"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></radialGradient>
    <pattern id="activity-grid" width="54" height="28" patternUnits="userSpaceOnUse"><path d="M54 0H0V28" fill="none" stroke="#00F7FF" stroke-opacity=".08"/></pattern>
    <clipPath id="activity-clip"><path d="M24 0H1148L1200 52V425L1170 455H52L0 403V24Z"/></clipPath>
    <filter id="activity-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#FFF7FF}.blue{fill:#00F7FF}.soft{fill:#B8B5D1}.faint{fill:#77738F}.mint{fill:#FF2BD6}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:activityPulse 3.2s ease-in-out infinite}@keyframes activityPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <path d="M24 0H1148L1200 52V425L1170 455H52L0 403V24Z" fill="url(#activity-wash)"/><g clip-path="url(#activity-clip)"><rect y="305" width="1200" height="150" fill="url(#activity-grid)"/><circle cx="1060" cy="115" r="230" fill="url(#activity-light)"/></g><path d="M24 0H1148L1200 52V425L1170 455H52L0 403V24Z" fill="none" stroke="url(#activity-neon)" stroke-opacity=".68" stroke-width="1.5"/>
  <path d="M24 1H218M1 403L52 454H236M1148 1l51 51v82" fill="none" stroke="#FF2BD6" stroke-width="2"/><path d="M38 67H1162" stroke="url(#activity-neon)" stroke-opacity=".28"/><circle cx="38" cy="35" r="3" fill="#FF2BD6" filter="url(#activity-soft)"/><text x="53" y="39" class="mono soft label">LIVE SIGNAL</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">PUBLIC GITHUB DATA</text>
