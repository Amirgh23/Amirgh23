<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="activity-title activity-desc">
  <title id="activity-title">LIVE SIGNAL</title><desc id="activity-desc">Minimal science-fiction interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="activity-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1624"/><stop offset=".58" stop-color="#050811"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <radialGradient id="activity-light"><stop stop-color="#79D9FF" stop-opacity=".16"/><stop offset="1" stop-color="#79D9FF" stop-opacity="0"/></radialGradient>
    <filter id="activity-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#F2FAFF}.blue{fill:#79D9FF}.soft{fill:#91A2B8}.faint{fill:#526176}.mint{fill:#6FE8C8}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:activityPulse 3.2s ease-in-out infinite}@keyframes activityPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="455" rx="18" fill="url(#activity-wash)"/><rect x=".75" y=".75" width="1198.5" height="453.5" rx="17" fill="none" stroke="#8ACBE8" stroke-opacity=".26" stroke-width="1.5"/>
  <circle cx="1060" cy="115" r="230" fill="url(#activity-light)"/><path d="M38 67H1162" stroke="#A4B8CA" stroke-opacity=".12"/><circle cx="38" cy="35" r="3" fill="#6FE8C8"/><text x="53" y="39" class="mono soft label">LIVE SIGNAL</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">PUBLIC GITHUB DATA</text>
  <g transform="translate(50 91)" class="mono"><rect width="1100" height="50" rx="9" fill="#08111D" fill-opacity="1"/><text x="18" y="30" class="faint micro">LATEST REPOSITORY</text><text x="1078" y="30" text-anchor="end" class="ice" font-size="13">amirgh23.github.io</text></g><g transform="translate(50 157)" class="mono"><rect width="1100" height="50" rx="9" fill="#08111D" fill-opacity=".72"/><text x="18" y="30" class="faint micro">PUBLIC REPOSITORIES</text><text x="1078" y="30" text-anchor="end" class="ice" font-size="13">17</text></g><g transform="translate(50 223)" class="mono"><rect width="1100" height="50" rx="9" fill="#08111D" fill-opacity="1"/><text x="18" y="30" class="faint micro">NETWORK</text><text x="1078" y="30" text-anchor="end" class="ice" font-size="13">1 followers · 14 stars</text></g><g transform="translate(50 289)" class="mono"><rect width="1100" height="50" rx="9" fill="#08111D" fill-opacity=".72"/><text x="18" y="30" class="faint micro">PRIMARY LANGUAGES</text><text x="1078" y="30" text-anchor="end" class="ice" font-size="13">JavaScript / Python / SCSS / TeX</text></g><g transform="translate(50 355)" class="mono"><rect width="1100" height="50" rx="9" fill="#08111D" fill-opacity="1"/><text x="18" y="30" class="faint micro">LAST PUSH</text><text x="1078" y="30" text-anchor="end" class="ice" font-size="13">2026-07-22 07:45 UTC</text></g></svg>