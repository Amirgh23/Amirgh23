<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="network-title network-desc">
  <title id="network-title">SYSTEM TOPOLOGY</title><desc id="network-desc">Minimal science-fiction interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="network-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1624"/><stop offset=".58" stop-color="#050811"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <radialGradient id="network-light"><stop stop-color="#79D9FF" stop-opacity=".16"/><stop offset="1" stop-color="#79D9FF" stop-opacity="0"/></radialGradient>
    <filter id="network-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#F2FAFF}.blue{fill:#79D9FF}.soft{fill:#91A2B8}.faint{fill:#526176}.mint{fill:#6FE8C8}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:networkPulse 3.2s ease-in-out infinite}@keyframes networkPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#network-wash)"/><rect x=".75" y=".75" width="1198.5" height="558.5" rx="17" fill="none" stroke="#8ACBE8" stroke-opacity=".26" stroke-width="1.5"/>
  <circle cx="1060" cy="115" r="230" fill="url(#network-light)"/><path d="M38 67H1162" stroke="#A4B8CA" stroke-opacity=".12"/><circle cx="38" cy="35" r="3" fill="#6FE8C8"/><text x="53" y="39" class="mono soft label">SYSTEM TOPOLOGY</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">10 CONNECTED NODES</text>
