<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="network-title network-desc">
  <title id="network-title">SYSTEM TOPOLOGY</title><desc id="network-desc">Retro-neon arcade interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="network-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16082B"/><stop offset=".48" stop-color="#050510"/><stop offset="1" stop-color="#07192A"/></linearGradient>
    <linearGradient id="network-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF2BD6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/></linearGradient>
    <radialGradient id="network-light"><stop stop-color="#FF2BD6" stop-opacity=".2"/><stop offset=".48" stop-color="#8B5CF6" stop-opacity=".09"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></radialGradient>
    <pattern id="network-grid" width="54" height="28" patternUnits="userSpaceOnUse"><path d="M54 0H0V28" fill="none" stroke="#00F7FF" stroke-opacity=".08"/></pattern>
    <clipPath id="network-clip"><path d="M24 0H1148L1200 52V530L1170 560H52L0 508V24Z"/></clipPath>
    <filter id="network-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#FFF7FF}.blue{fill:#00F7FF}.soft{fill:#B8B5D1}.faint{fill:#77738F}.mint{fill:#FF2BD6}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:networkPulse 3.2s ease-in-out infinite}@keyframes networkPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <path d="M24 0H1148L1200 52V530L1170 560H52L0 508V24Z" fill="url(#network-wash)"/><g clip-path="url(#network-clip)"><rect y="410" width="1200" height="150" fill="url(#network-grid)"/><circle cx="1060" cy="115" r="230" fill="url(#network-light)"/></g><path d="M24 0H1148L1200 52V530L1170 560H52L0 508V24Z" fill="none" stroke="url(#network-neon)" stroke-opacity=".68" stroke-width="1.5"/>
  <path d="M24 1H218M1 508L52 559H236M1148 1l51 51v82" fill="none" stroke="#FF2BD6" stroke-width="2"/><path d="M38 67H1162" stroke="url(#network-neon)" stroke-opacity=".28"/><circle cx="38" cy="35" r="3" fill="#FF2BD6" filter="url(#network-soft)"/><text x="53" y="39" class="mono soft label">SYSTEM TOPOLOGY</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">10 CONNECTED NODES</text>
  <g fill="none" stroke="#00F7FF" stroke-opacity=".26"><path d="M600 280L185 135"/><path d="M600 280L398 95"/><path d="M600 280L802 95"/><path d="M600 280L1015 135"/><path d="M600 280L1070 280"/><path d="M600 280L1015 425"/><path d="M600 280L802 465"/><path d="M600 280L398 465"/><path d="M600 280L185 425"/><path d="M600 280L130 280"/></g><g transform="translate(600 280)"><circle r="91" fill="#080615" stroke="#FF2BD6" stroke-opacity=".74"/><circle r="65" fill="none" stroke="#00F7FF" stroke-opacity=".62"/><circle r="55" fill="#8B5CF6" fill-opacity=".08"/><text y="-4" text-anchor="middle" class="mono ice" font-size="15">AMIRGH23</text><text y="19" text-anchor="middle" class="mono mint micro">CORE ONLINE</text></g><g transform="translate(185 135)" class="mono"><circle r="44" fill="#0B0718" stroke="#00F7FF" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#FF2BD6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">VISION</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(398 95)" class="mono"><circle r="44" fill="#0B0718" stroke="#FF2BD6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#8B5CF6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">RAG</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(802 95)" class="mono"><circle r="44" fill="#0B0718" stroke="#8B5CF6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#00F7FF" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">CODE</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(1015 135)" class="mono"><circle r="44" fill="#0B0718" stroke="#00F7FF" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#FF2BD6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">SECURITY</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(1070 280)" class="mono"><circle r="44" fill="#0B0718" stroke="#FF2BD6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#8B5CF6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">MEMORY</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(1015 425)" class="mono"><circle r="44" fill="#0B0718" stroke="#8B5CF6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#00F7FF" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">MCP</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(802 465)" class="mono"><circle r="44" fill="#0B0718" stroke="#00F7FF" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#FF2BD6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">OCR</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(398 465)" class="mono"><circle r="44" fill="#0B0718" stroke="#FF2BD6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#8B5CF6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">QDRANT</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(185 425)" class="mono"><circle r="44" fill="#0B0718" stroke="#8B5CF6" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#00F7FF" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">AGENTS</text><text y="17" text-anchor="middle" class="mint" font-size="8">ONLINE</text></g><g transform="translate(130 280)" class="mono"><circle r="44" fill="#0B0718" stroke="#00F7FF" stroke-opacity=".58"/><circle r="39" fill="none" stroke="#FF2BD6" stroke-opacity=".16"/><text y="-2" text-anchor="middle" class="ice" font-size="12">TOOLS</text><text y="17" text-anchor="m