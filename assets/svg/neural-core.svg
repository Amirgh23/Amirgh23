<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">SYSTEM TELEMETRY</title><desc id="core-desc">Retro-neon arcade interface for AMIRGH23.</desc>
  <defs>
