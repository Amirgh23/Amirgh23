    <linearGradient id="core-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF2BD6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/></linearGradient>
