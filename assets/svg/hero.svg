<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AMIRGH23 Neural Nexus</title><desc id="hero-desc">Cyberpunk command interface for autonomous intelligence architect Amirreza Ghaffarian.</desc>
  <defs>
    <!-- NEXUS DESIGN TOKENS: bg #02030A, surface #070B18, cyan #00F7FF, pink #FF2BD6, purple #8B5CF6, green #39FF14 -->
    <linearGradient id="hero-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00F7FF"/><stop offset=".48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <radialGradient id="hero-core"><stop stop-color="#D9FAFF"/><stop offset=".14" stop-color="#00F7FF"/><stop offset=".55" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#02030A" stop-opacity="0"/></radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00F7FF" stroke-opacity=".075"/></pattern>
    <pattern id="hero-scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1200" stroke="#D9FAFF" stroke-opacity=".025"/></pattern>
    <filter id="hero-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hero-clip"><path d="M18 0H1182L1200 18V482L1182 500H18L0 482V18Z"/></clipPath>
    <style>
      .ui{font-family:Rajdhani,Oxanium,Arial,sans-serif}.mono{font-family:'Share Tech Mono','Courier New',monospace}.cyan{fill:#00F7FF}.muted{fill:#60758F}.line{fill:none;stroke:#00F7FF;stroke-width:1}.pulse{animation:heroPulse 2.6s ease-in-out infinite}.dash{stroke-dasharray:8 16;animation:heroFlow 5s linear infinite}.glitch{animation:heroGlitch 7s steps(1) infinite}@keyframes heroPulse{50%{opacity:.35;transform:scale(.96)}}@keyframes heroFlow{to{stroke-dashoffset:-96}}@keyframes heroGlitch{0%,92%,100%{transform:translate(0)}93%{transform:translate(4px,-1px)}94%{transform:translate(-2px,1px)}95%{transform:translate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#hero-clip)"><rect width="1200" height="500" fill="#02030A"/><rect width="1200" height="500" fill="url(#hero-grid)"/><rect width="1200" height="500" fill="url(#hero-scan)"/>
    <path d="M0 80H195l28 28h116M0 418h140l26-26h168M1200 86h-112l-24 24h-92M1200 414h-170l-28-28h-90" class="line dash" opacity=".35"/>
    <g opacity=".55" class="mono" font-size="10" fill="#60758F"><text x="30" y="36">NEXUS://7F3A-09D1</text><text x="1020" y="36">SECURE CHANNEL 08</text><text x="30" y="474">0xA93F / KERNEL.v23</text><text x="1010" y="474">PACKET 11001001</text></g>
    <g class="ui"><text x="58" y="92" fill="#39FF14" font-size="13" letter-spacing="4">● NETWORK STATUS: ONLINE</text><text x="58" y="205" class="glitch" fill="#D9FAFF" font-size="76" font-weight="800" letter-spacing="8">AMIRGH23</text><text x="62" y="246" fill="url(#hero-edge)" font-size="27" font-weight="700" letter-spacing="12">NEURAL NEXUS</text><text x="62" y="278" fill="#D9FAFF" font-size="15" letter-spacing="4">AUTONOMOUS INTELLIGENCE ARCHITECT</text></g>
    <g class="mono" font-size="11"><rect x="58" y="310" width="540" height="112" fill="#050816" stroke="#00F7FF" stroke-opacity=".28"/><path d="M58 325h10v-15h15M598 407h-10v15h-15" class="line"/><text x="78" y="336" fill="#FF2BD6">CLASSIFIED NEURAL INTERFACE // BOOT TRACE</text><text x="78" y="360" fill="#60758F">INITIALIZING AMIRGH23 KERNEL</text><text x="78" y="378" fill="#60758F">LOADING AUTONOMOUS AGENTS · MOUNTING VECTOR MEMORY</text><text x="78" y="396" fill="#39FF14">SECURE LINK ESTABLISHED · ACCESS GRANTED</text><rect x="78" y="407" width="484" height="4" fill="#172033"/><rect x="78" y="407" width="454" height="4" fill="url(#hero-edge)"/></g>
    <g transform="translate(870 250)" filter="url(#hero-glow)"><circle r="142" fill="none" stroke="#00F7FF" stroke-opacity=".12"/><circle r="112" fill="none" stroke="#FF2BD6" stroke-width="2" stroke-dasharray="7 16" class="dash"/><circle r="82" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2 9" class="dash"/><circle r="60" fill="url(#hero-core)" class="pulse"/><path d="M-165 0h88M77 0h165M0-165v88M0 77v165M-115-115l57 57M58 58l57 57M115-115L58-58M-58 58l-57 57" stroke="#00F7FF" stroke-opacity=".5"/><g fill="#00F7FF"><circle cx="-77" r="4"/><circle cx="77" r="4"/><circle cy="-77" r="4"/><circle cy="77" r="4"/></g><text y="5" text-anchor="middle" class="mono" font-size="12" fill="#02030A" font-weight="700">CORE</text></g>
    <g class="mono" font-size="10" fill="#60758F"><text x="1030" y="188">NODE-ID: AMIRGH23</text><text x="1030" y="207">CLEARANCE: OMEGA</text><text x="1030" y="226">SYNC: 94.8%</text></g>
  </g><path d="M18 .75H1182L1199.25 18V482L1182 499.25H18L.75 482V18Z" fill="none" stroke="url(#hero-edge)" stroke-width="1.5"/>
</svg>
