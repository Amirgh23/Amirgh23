<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AMIRGH23 / NEURAL NEXUS</title><desc id="hero-desc">Retro-neon arcade interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16082B"/><stop offset=".48" stop-color="#050510"/><stop offset="1" stop-color="#07192A"/></linearGradient>
    <linearGradient id="hero-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF2BD6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/></linearGradient>
    <radialGradient id="hero-light"><stop stop-color="#FF2BD6" stop-opacity=".2"/><stop offset=".48" stop-color="#8B5CF6" stop-opacity=".09"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></radialGradient>
    <pattern id="hero-grid" width="54" height="28" patternUnits="userSpaceOnUse"><path d="M54 0H0V28" fill="none" stroke="#00F7FF" stroke-opacity=".08"/></pattern>
    <clipPath id="hero-clip"><path d="M24 0H1148L1200 52V470L1170 500H52L0 448V24Z"/></clipPath>
    <filter id="hero-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#FFF7FF}.blue{fill:#00F7FF}.soft{fill:#B8B5D1}.faint{fill:#77738F}.mint{fill:#FF2BD6}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:heroPulse 3.2s ease-in-out infinite}@keyframes heroPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <path d="M24 0H1148L1200 52V470L1170 500H52L0 448V24Z" fill="url(#hero-wash)"/><g clip-path="url(#hero-clip)"><rect y="350" width="1200" height="150" fill="url(#hero-grid)"/><circle cx="1060" cy="115" r="230" fill="url(#hero-light)"/></g><path d="M24 0H1148L1200 52V470L1170 500H52L0 448V24Z" fill="none" stroke="url(#hero-neon)" stroke-opacity=".68" stroke-width="1.5"/>
  <path d="M24 1H218M1 448L52 499H236M1148 1l51 51v82" fill="none" stroke="#FF2BD6" stroke-width="2"/><path d="M38 67H1162" stroke="url(#hero-neon)" stroke-opacity=".28"/><circle cx="38" cy="35" r="3" fill="#FF2BD6" filter="url(#hero-soft)"/><text x="53" y="39" class="mono soft label">AMIRGH23 / NEURAL NEXUS</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">INTERFACE 03 — ONLINE</text>
  
  <style>.hero-kicker{animation:heroFlicker 6s steps(1,end) infinite}.hero-signal{stroke-dasharray:90 1035;animation:heroSignal 5.5s linear infinite}.hero-orbit{transform-box:fill-box;transform-origin:center}.hero-orbit-a{animation:heroSpin 18s linear infinite}.hero-orbit-b{animation:heroSpinBack 12s linear infinite}.hero-orbit-c{animation:heroSpin 8s linear infinite}.hero-core{transform-box:fill-box;transform-origin:center;animation:heroBreathe 2.8s ease-in-out infinite}.hero-sweep{animation:heroSweep 4.2s ease-in-out infinite}@keyframes heroSpin{to{transform:rotate(360deg)}}@keyframes heroSpinBack{to{transform:rotate(-360deg)}}@keyframes heroBreathe{50%{transform:scale(1.16);opacity:.72}}@keyframes heroSignal{to{stroke-dashoffset:-1125}}@keyframes heroSweep{0%,12%{transform:translateX(0);opacity:0}25%,72%{opacity:.42}88%,100%{transform:translateX(446px);opacity:0}}@keyframes heroFlicker{0%,91%,94%,100%{opacity:1}92%,93%{opacity:.32}}@media(prefers-reduced-motion:reduce){.hero-kicker,.hero-signal,.hero-orbit,.hero-core,.hero-sweep{animation:none!important}}</style>
  <path d="M38 67H1162" class="hero-signal" fill="none" stroke="#00F7FF" stroke-width="1.5" stroke-opacity=".72"/>
  <g class="sans"><text x="64" y="132" class="mono mint label hero-kicker">AUTONOMOUS INTELLIGENCE SYSTEMS</text><text x="60" y="232" class="ice" font-size="78" font-weight="650" letter-spacing="-2">AMIRGH23</text><text x="63" y="282" class="blue" font-size="25" font-weight="500" letter-spacing="9">NEURAL NEXUS</text><text x="63" y="334" class="soft" font-size="18">AI &amp; Robotics · Agents · Learning Systems · Intelligent Interfaces</text><text x="63" y="375" class="faint" font-size="14">Engineering intelligence beyond the demo.</text></g>
  <g transform="translate(63 411)" class="mono"><rect width="468" height="52" rx="8" fill="#0B0718" stroke="#00F7FF" stroke-opacity=".52"/><rect class="hero-sweep" width="22" height="52" fill="#00F7FF" opacity="0"/><path d="M0 0h155" stroke="#FF2BD6" stroke-width="2"/><text x="18" y="32" class="ice" font-size="13">THE FUTURE IS ENGINEERED.</text><circle cx="437" cy="26" r="5" fill="#FF2BD6" class="pulse" filter="url(#hero-soft)"/></g>
  <g transform="translate(886 255)"><circle r="151" fill="#080615" stroke="#FF2BD6" stroke-opacity=".45"/><g class="hero-orbit hero-orbit-a"><circle r="114" fill="none" stroke="#8B5CF6" stroke-opacity=".62" stroke-dasharray="42 18"/><circle cy="-114" r="5" fill="#FF2BD6" filter="url(#hero-soft)"/></g><g class="hero-orbit hero-orbit-b"><circle r="79" fill="none" stroke="#00F7FF" stroke-opacity=".82" stroke-dasharray="66 12"/><circle cx="79" r="4" fill="#00F7FF"/></g><g class="hero-orbit hero-orbit-c"><circle r="52" fill="none" stroke="#FF2BD6" stroke-opacity=".32" stroke-dasharray="8 22"/><circle cx="-52" r="3" fill="#FF7AE5"/></g><g class="hero-core"><circle r="38" fill="#FF2BD6" fill-opacity=".12" stroke="#FF7AE5"/><circle r="10" fill="#00F7FF" filter="url(#hero-soft)"/></g><g stroke="#00F7FF" stroke-opacity=".38"><path d="M-180 0h101M79 0h101M0-180v101M0 79v101"/></g></g>
  <g class="mono faint micro"><text x="1048" y="440">CORE SYNC</text><text x="1048" y="459" class="ice">94.0%</text></g></svg>
