<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">AMIRGH23 / NEURAL NEXUS</title><desc id="hero-desc">Minimal science-fiction interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1624"/><stop offset=".58" stop-color="#050811"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
    <radialGradient id="hero-light"><stop stop-color="#79D9FF" stop-opacity=".16"/><stop offset="1" stop-color="#79D9FF" stop-opacity="0"/></radialGradient>
    <filter id="hero-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#F2FAFF}.blue{fill:#79D9FF}.soft{fill:#91A2B8}.faint{fill:#526176}.mint{fill:#6FE8C8}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:heroPulse 3.2s ease-in-out infinite}@keyframes heroPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="500" rx="18" fill="url(#hero-wash)"/><rect x=".75" y=".75" width="1198.5" height="498.5" rx="17" fill="none" stroke="#8ACBE8" stroke-opacity=".26" stroke-width="1.5"/>
  <circle cx="1060" cy="115" r="230" fill="url(#hero-light)"/><path d="M38 67H1162" stroke="#A4B8CA" stroke-opacity=".12"/><circle cx="38" cy="35" r="3" fill="#6FE8C8"/><text x="53" y="39" class="mono soft label">AMIRGH23 / NEURAL NEXUS</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">INTERFACE 03 — ONLINE</text>
  
  <g class="sans"><text x="64" y="132" class="mono mint label">AUTONOMOUS INTELLIGENCE SYSTEMS</text><text x="60" y="232" class="ice" font-size="78" font-weight="650" letter-spacing="-2">AMIRGH23</text><text x="63" y="282" class="blue" font-size="25" font-weight="500" letter-spacing="9">NEURAL NEXUS</text><text x="63" y="334" class="soft" font-size="18">AI &amp; Robotics · Agents · Learning Systems · Intelligent Interfaces</text><text x="63" y="375" class="faint" font-size="14">Engineering intelligence beyond the demo.</text></g>
  <g transform="translate(63 411)" class="mono"><rect width="468" height="52" rx="8" fill="#0B1220" stroke="#79D9FF" stroke-opacity=".28"/><text x="18" y="32" class="ice" font-size="13">THE FUTURE IS ENGINEERED.</text><circle cx="437" cy="26" r="5" fill="#6FE8C8" class="pulse"/></g>
  <g transform="translate(886 255)"><circle r="151" fill="#07101B" stroke="#79D9FF" stroke-opacity=".2"/><circle r="114" fill="none" stroke="#AFC7D8" stroke-opacity=".18"/><circle r="79" fill="none" stroke="#79D9FF" stroke-opacity=".46"/><circle r="38" fill="#79D9FF" fill-opacity=".1" stroke="#B6F3FF"/><circle r="10" fill="#B6F3FF" filter="url(#hero-soft)"/><g stroke="#79D9FF" stroke-opacity=".28"><path d="M-180 0h101M79 0h101M0-180v101M0 79v101"/></g><g fill="#6FE8C8"><circle cx="-114" r="4"/><circle cx="114" r="4"/></g></g>
  <g class="mono faint micro"><text x="1048" y="440">CORE SYNC</text><text x="1048" y="459" class="ice">94.0%</text></g></svg>
