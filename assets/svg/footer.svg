<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">NEURAL NEXUS</title><desc id="footer-desc">Retro-neon arcade interface for AMIRGH23.</desc>
  <defs>
    <linearGradient id="footer-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16082B"/><stop offset=".48" stop-color="#050510"/><stop offset="1" stop-color="#07192A"/></linearGradient>
    <linearGradient id="footer-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF2BD6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00F7FF"/></linearGradient>
    <radialGradient id="footer-light"><stop stop-color="#FF2BD6" stop-opacity=".2"/><stop offset=".48" stop-color="#8B5CF6" stop-opacity=".09"/><stop offset="1" stop-color="#00F7FF" stop-opacity="0"/></radialGradient>
    <pattern id="footer-grid" width="54" height="28" patternUnits="userSpaceOnUse"><path d="M54 0H0V28" fill="none" stroke="#00F7FF" stroke-opacity=".08"/></pattern>
    <clipPath id="footer-clip"><path d="M24 0H1148L1200 52V270L1170 300H52L0 248V24Z"/></clipPath>
    <filter id="footer-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.sans{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ice{fill:#FFF7FF}.blue{fill:#00F7FF}.soft{fill:#B8B5D1}.faint{fill:#77738F}.mint{fill:#FF2BD6}.label{font-size:11px;letter-spacing:2.6px}.micro{font-size:10px}.pulse{animation:footerPulse 3.2s ease-in-out infinite}@keyframes footerPulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <path d="M24 0H1148L1200 52V270L1170 300H52L0 248V24Z" fill="url(#footer-wash)"/><g clip-path="url(#footer-clip)"><rect y="150" width="1200" height="150" fill="url(#footer-grid)"/><circle cx="1060" cy="115" r="230" fill="url(#footer-light)"/></g><path d="M24 0H1148L1200 52V270L1170 300H52L0 248V24Z" fill="none" stroke="url(#footer-neon)" stroke-opacity=".68" stroke-width="1.5"/>
  <path d="M24 1H218M1 248L52 299H236M1148 1l51 51v82" fill="none" stroke="#FF2BD6" stroke-width="2"/><path d="M38 67H1162" stroke="url(#footer-neon)" stroke-opacity=".28"/><circle cx="38" cy="35" r="3" fill="#FF2BD6" filter="url(#footer-soft)"/><text x="53" y="39" class="mono soft label">NEURAL NEXUS</text><text x="1162" y="39" text-anchor="end" class="mono faint micro">CHANNEL REMAINS OPEN</text>
  <g text-anchor="middle" class="sans"><text x="600" y="118" class="ice" font-size="30" font-weight="560">Continue beyond the profile.</text><text x="600" y="157" class="soft" font-size="15">Explore the interactive system, complete repository network and live intelligence core.</text><g transform="translate(466 191)" class="mono"><rect width="268" height="48" rx="9" fill="#8B5CF6" fill-opacity=".12" stroke="#00F7FF" stroke-opacity=".62"/><path d="M0 0h92" stroke="#FF2BD6" stroke-width="2"/><text x="134" y="30" text-anchor="middle" class="blue" font-size="12">ENTER NEURAL NEXUS →</text></g><text x="600" y="270" class="faint micro">AMIRGH23 / SYSTEM ONLINE</text></g></svg>
