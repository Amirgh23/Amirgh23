<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="foot-title foot-desc"><title id="foot-title">Neural Nexus footer</title><desc id="foot-desc">Cyberpunk skyline and closing transmission.</desc><defs><linearGradient id="ft-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8B5CF6" stop-opacity=".25"/><stop offset="1" stop-color="#02030A"/></linearGradient><filter id="ft-glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ui{font-family:Rajdhani,Arial,sans-serif}.mono{font-family:'Share Tech Mono','Courier New',monospace}.blink{animation:ftBlink 2s steps(1) infinite}@keyframes ftBlink{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="300" fill="#02030A"/><rect width="1200" height="300" fill="url(#ft-sky)"/><path d="M0 260h80v-50h30v-35h35v85h40v-115h48v115h30v-70h65v70h30v-140h55v140h34v-95h45v95h32v-55h70v55h35v-125h50v125h35v-80h62v80h38v-160h62v160h34v-95h50v95h34v-55h66v55h35v-120h58v120h53" fill="#050816" stroke="#00F7FF" stroke-opacity=".45"/><path d="M0 270h1200" stroke="#FF2BD6" filter="url(#ft-glow)"/><g fill="#00F7FF" opacity=".35"><path d="M98 220h7v7h-7zM203 160h8v12h-8zM374 135h10v20h-10zM648 155h8v15h-8zM823 115h11v20h-11zM1044 155h9v16h-9z"/></g><text x="600" y="62" text-anchor="middle" class="ui" fill="#D9FAFF" font-size="25" font-weight="700" letter-spacing="7">CONNECTION TERMINATED</text><text x="600" y="91" text-anchor="middle" class="mono" fill="#60758F" font-size="12" letter-spacing="2">YOU HAVE REACHED THE EDGE OF THE NEURAL NETWORK</text><text x="600" y="129" text-anchor="middle" class="mono" fill="#00F7FF" font-size="13">[ ACCESS PROJECTS ]   [ TRANSMIT MESSAGE ]   [ ENTER NEURAL NEXUS ]</text><text x="600" y="166" text-anchor="middle" class="ui" fill="#FF2BD6" font-size="15" letter-spacing="4">THE FUTURE IS NOT PREDICTED. IT IS ENGINEERED.</text><circle cx="600" cy="200" r="4" fill="#39FF14" class="blink"/></svg>
