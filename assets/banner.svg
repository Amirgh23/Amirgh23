<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#9B59FF"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#9B59FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#06070a" />
  <g filter="url(#glow)">
    <text x="50%" y="40%" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial" font-size="28" fill="url(#g1)" opacity="0.95">AMIRREZA GHAFFARIAN</text>
    <text x="50%" y="62%" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="20" fill="#c7d2ff" opacity="0.9">AI & ROBOTICS RESEARCH — NEURAL CORE ACTIVE</text>
  </g>
  <!-- subtle grid lines -->
  <g stroke="#081226" stroke-width="1">
    <path d="M0 180 H1200"/>
    <path d="M0 200 H1200"/>
  </g>
</svg>
